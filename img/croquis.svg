    <rect x="300" y="45" width="280" height="95" rx="12"/>
    <rect x="675" y="45" width="205" height="95" rx="12"/>
    <rect x="20" y="260" width="190" height="100" rx="12"/>
    <rect x="300" y="260" width="280" height="100" rx="12"/>
    <rect x="675" y="260" width="205" height="100" rx="12"/>
  </g>
  <path d="M0 200H900M255 35V375M630 35V375" stroke="#fff" stroke-width="65"/>
